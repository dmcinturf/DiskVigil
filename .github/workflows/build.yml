name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: diskvigil.exe
            asset: windows-x86_64
            test: true
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: diskvigil
            asset: linux-x86_64
            test: true
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: diskvigil
            asset: macos-apple-silicon
            test: true
          # Intel Macs: cross-compiled on the Apple Silicon runner (tests run on the native target only)
          - os: macos-latest
            target: x86_64-apple-darwin
            exe: diskvigil
            asset: macos-intel
            test: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - if: matrix.test
        run: cargo test --workspace --target ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      # Windows code signing via SignPath (https://signpath.org). Runs only for release tags, and only once the
      # repository variable SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN are configured.
      # Each request waits for manual approval in SignPath.
      - name: Upload unsigned executable for signing
        id: upload-unsigned
        if: matrix.asset == 'windows-x86_64' && startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v5
        with:
          name: signpath-unsigned-exe
          path: target/${{ matrix.target }}/release/${{ matrix.exe }}
          if-no-files-found: error
      - name: Sign with SignPath
        if: steps.upload-unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'DiskVigil' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed
      - name: Use signed executable
        if: steps.upload-unsigned.outcome == 'success'
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/${{ matrix.exe }}"
          Copy-Item "signed/${{ matrix.exe }}" $exe -Force
          $sig = Get-AuthenticodeSignature $exe
          "Signature: $($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "Signed executable failed verification: $($sig.StatusMessage)" }
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || version="dev-${GITHUB_SHA::7}"
          name="diskvigil-${version}-${{ matrix.asset }}"
          mkdir -p "pkg/$name" dist
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" README.md LICENSE "pkg/$name/"
          cd pkg
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a -tzip "../dist/$name.zip" "$name" > /dev/null
          else
            chmod +x "$name/${{ matrix.exe }}"
            tar -czf "../dist/$name.tar.gz" "$name"
          fi
          ls -l ../dist
      - uses: actions/upload-artifact@v5
        with:
          name: diskvigil-${{ matrix.asset }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write          # Sigstore keyless signing
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: diskvigil-*
          merge-multiple: true
      # SLSA build provenance signed with Sigstore. Verify with: gh attestation verify <file> --repo dmcinturf/DiskVigil
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/diskvigil-*
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Portable builds of DiskVigil. Download the package for your system, extract it and run `diskvigil`. No installation needed.

          | Package | System |
          |---|---|
          | `windows-x86_64.zip` | Windows 10/11 (64-bit). Run as Administrator for SMART access. |
          | `linux-x86_64.tar.gz` | Linux x86_64 (glibc 2.35+). Run with `sudo` for SMART access. |
          | `macos-apple-silicon.tar.gz` | macOS on M-series Macs. Requires `smartctl` (`brew install smartmontools`). |
          | `macos-intel.tar.gz` | macOS on Intel Macs. Requires `smartctl`. |

          The binaries are not code-signed: Windows SmartScreen may ask you to confirm ("More info → Run anyway"), and on macOS run `xattr -d com.apple.quarantine diskvigil` once after extracting.
          Try it without hardware access: `diskvigil --demo`.

          **Verify a download:** every package has a Sigstore-signed build provenance attestation proving it was built by this repository's GitHub Actions workflow. With the GitHub CLI: `gh attestation verify <package> --repo dmcinturf/DiskVigil`. Checksums are in `SHA256SUMS.txt`.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --title "DiskVigil $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
